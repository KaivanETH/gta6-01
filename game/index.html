<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bahía Dorada — an original open-world crime game</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #120a24; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: auto; }
    /* shown until the first module frame paints over the canvas, so a cold start is never blank */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffc93c; font: 900 28px "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0.08em; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    #noscript { color: #fff; font: 16px sans-serif; padding: 2em; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
  <div id="boot" aria-hidden="true">BAHÍA DORADA</div>
  <noscript><p id="noscript">Bahía Dorada needs JavaScript enabled.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
